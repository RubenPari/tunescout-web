# Deploy su Google Cloud Run a ogni release pubblicata (o a mano da Actions).
# Configurazione una tantum: scripts/setup-github-deploy.sh (vedi README).
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

# Un deploy alla volta; quelli successivi aspettano invece di annullare.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # token OIDC per Workload Identity Federation
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - id: deploy
        run: |
          ./scripts/deploy-gcp.sh
          url="$(gcloud run services describe "${SERVICE:-tunescout-web}" --region "$REGION" \
            --project "$GCP_PROJECT_ID" --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_ONLY: "1"
          IMAGE_TAG: ${{ github.event.release.tag_name || github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          DB_PROJECT: ${{ vars.DB_PROJECT }}
          DB_INSTANCE: ${{ vars.DB_INSTANCE }}
          DB_CONN: ${{ vars.DB_CONN }}
          BASE_URL: ${{ vars.BASE_URL }}
          SERVICE: ${{ vars.SERVICE }}
          MIN_INSTANCES: ${{ vars.MIN_INSTANCES }}
          MEMORY: ${{ vars.MEMORY }}
          TUNESCOUT_MODEL: ${{ vars.TUNESCOUT_MODEL }}
          TUNESCOUT_EFFORT: ${{ vars.TUNESCOUT_EFFORT }}
          DAILY_RUN_LIMIT: ${{ vars.DAILY_RUN_LIMIT }}
          MAX_CONCURRENT_JOBS: ${{ vars.MAX_CONCURRENT_JOBS }}
